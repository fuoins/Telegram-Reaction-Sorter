name: Build LSPosed module APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # ubuntu-latest ships an Android SDK; no third-party setup action is needed
      # (v3 of that action calls "sdkmanager tools", a package removed from new
      # cmdline-tools, which makes the job fail before Gradle even starts).
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (ranking logic)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify build outputs
        run: |
          ls -lh app/build/outputs/apk/debug app/build/outputs/apk/release
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -p app/build/outputs/apk/release/app-release.apk assets/xposed_init | grep -q 'HookEntry'

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reaction-sorter-apk-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          body: |
            LSPosed module: rank messages in a Telegram chat by total reaction count and jump to them.

            Install `app-release.apk`, enable the module in LSPosed, tick your Telegram client
            in the scope, then force-stop and reopen the client.
